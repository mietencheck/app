name = "mietencheck"
main = "./src/worker.ts"
compatibility_date = "2026-03-12"

[[routes]]
pattern = "mietencheck.de"
custom_domain = true

[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"

# Vite output; use `wrangler pages deploy dist`, not `wrangler versions upload` (Workers bundle).
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "mietenbremse"
database_id = "4d9beea1-58a4-4c43-8746-57b7cd41273d"
